name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Demo regression suite (v2 is expected to fail two scenarios)
        run: blackbox demo --out demo-runs --key ci-key
      - name: Every recorded ledger verifies
        run: blackbox verify demo-runs --key ci-key
