[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-blackbox"
version = "0.1.0"
description = "Tamper-evident flight recorder for LLM agents: hash-chained logs, PII pseudonymisation, deterministic replay and behavioural regression tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aditya Singh Shekhawat" }]
keywords = ["llm", "agents", "audit-log", "eu-ai-act", "gdpr", "replay", "regression-testing"]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
blackbox = "blackbox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
